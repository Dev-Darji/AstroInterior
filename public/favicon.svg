<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- Base rounded jewel tile with dark indigo/charcoal background -->
  <rect width="44" height="44" rx="10" fill="#0A0E1C" />
  <rect x="0.75" y="0.75" width="42.5" height="42.5" rx="9.25" stroke="#DEC695" stroke-width="1.2" stroke-opacity="0.5" />

  <!-- Celestial orbital ring -->
  <circle cx="22" cy="22" r="16.5" stroke="#DEC695" stroke-width="0.8" stroke-opacity="0.4" />

  <!-- Vastu 4-Directional Sacred Diamond (Rhombus 45°) -->
  <polygon points="22,6.5 37.5,22 22,37.5 6.5,22" stroke="#DEC695" stroke-width="1.4" stroke-linejoin="round" fill="none" />

  <!-- Cardinal Celestial Rays (North-South & East-West) -->
  <line x1="22" y1="8" x2="22" y2="36" stroke="#DEC695" stroke-width="1.3" stroke-linecap="round" />
  <line x1="8" y1="22" x2="36" y2="22" stroke="#DEC695" stroke-width="1.3" stroke-linecap="round" />

  <!-- Ordinal 45-degree rays -->
  <line x1="13.5" y1="13.5" x2="30.5" y2="30.5" stroke="#B89758" stroke-width="0.8" stroke-opacity="0.6" />
  <line x1="30.5" y1="13.5" x2="13.5" y2="30.5" stroke="#B89758" stroke-width="0.8" stroke-opacity="0.6" />

  <!-- Inner Sanctum Architectural Core -->
  <circle cx="22" cy="22" r="6.5" stroke="#DEC695" stroke-width="1" fill="#141A30" />

  <!-- Central Prana Bindu (Golden luminous node) -->
  <circle cx="22" cy="22" r="2.5" fill="#DEC695" />

  <!-- Cardinal Apex Bindus -->
  <circle cx="22" cy="6.5" r="1.4" fill="#DEC695" />
  <circle cx="37.5" cy="22" r="1.4" fill="#DEC695" />
  <circle cx="22" cy="37.5" r="1.4" fill="#DEC695" />
  <circle cx="6.5" cy="22" r="1.4" fill="#DEC695" />
</svg>
